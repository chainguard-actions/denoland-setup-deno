name: Test basic usage - default deno version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          deno-version: "2.x"
      - name: Assert deno is installed
        run: |
          echo "deno-version output: ${{ steps.action.outputs.deno-version }}"
          echo "release-channel output: ${{ steps.action.outputs.release-channel }}"
          if ! command -v deno &> /dev/null; then
            echo "FAIL: deno binary not found in PATH"
            exit 1
          fi
          echo "PASS: deno is installed"
      - name: Assert deno-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS: deno-version output is set to $ACTUAL"
      - name: Assert release-channel output is set
        env:
          ACTUAL: ${{ steps.action.outputs.release-channel }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: release-channel output is empty"
            exit 1
          fi
          echo "PASS: release-channel output is set to $ACTUAL"
