name: Test basic Deno setup (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          deno-version: "2.x"
      - name: Assert deno is in PATH
        run: |
          which deno || { echo "FAIL: deno not found in PATH"; exit 1; }
          echo "PASS: deno found at $(which deno)"
      - name: Assert deno runs
        run: |
          deno --version || { echo "FAIL: deno --version failed"; exit 1; }
          echo "PASS: deno --version succeeded"
      - name: Assert deno-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.deno-version }}
        run: |
          echo "actual deno-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS: deno-version output is '$ACTUAL'"
      - name: Assert release-channel output is stable
        env:
          ACTUAL: ${{ steps.setup.outputs.release-channel }}
        run: |
          echo "actual release-channel: $ACTUAL"
          if [ "$ACTUAL" != "stable" ]; then
            echo "FAIL: expected release-channel 'stable', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: release-channel is '$ACTUAL'"
