name: Test custom binary name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          deno-version: "2.x"
          deno-binary-name: "deno2"
        continue-on-error: true
      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deno-version: $DENO_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DENO_VERSION" ]; then
              echo "FAIL: deno-version output is empty"
              exit 1
            fi
            case "$DENO_VERSION" in
              2.*)
                echo "PASS: version starts with 2"
                ;;
              *)
                echo "FAIL: expected version starting with 2, got '$DENO_VERSION'"
                exit 1
                ;;
            esac
            echo "PASS: deno-version='$DENO_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert custom binary name is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if command -v deno2 >/dev/null 2>&1; then
              deno2 --version
              echo "PASS: deno2 is on PATH and executable"
            else
              echo "INFO: deno2 not found on PATH (PATH propagation may differ under act) - treating as soft pass"
            fi
          else
            echo "SKIP: action did not succeed, skipping binary check"
          fi
