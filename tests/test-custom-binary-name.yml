name: Test custom deno binary name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache directories
        run: |
          mkdir -p /tmp/runner-tool-cache
          mkdir -p /tmp/runner-temp
      - id: action
        uses: .
        with:
          deno-version: "2.x"
          deno-binary-name: "deno2"
      - name: Assert deno-version output is set
        env:
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS: deno-version=$DENO_VERSION"
      - name: Assert custom binary name is on PATH
        run: |
          echo "PATH: $PATH"
          if ! command -v deno2 >/dev/null 2>&1; then
            echo "FAIL: deno2 not found on PATH"
            exit 1
          fi
          INSTALLED_VERSION="$(deno2 --version | head -1)"
          echo "PASS: $INSTALLED_VERSION"
