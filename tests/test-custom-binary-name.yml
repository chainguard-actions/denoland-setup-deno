name: Test setup-deno with custom binary name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          deno-version: "2.1.4"
          deno-binary-name: "deno2"
      - name: Assert custom binary name is in PATH
        run: |
          which deno2 || { echo "FAIL: deno2 not found in PATH"; exit 1; }
          echo "PASS: deno2 found at $(which deno2)"
      - name: Assert custom binary runs
        run: |
          deno2 --version || { echo "FAIL: deno2 --version failed"; exit 1; }
          echo "PASS: deno2 --version succeeded"
      - name: Assert deno-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.deno-version }}
        run: |
          echo "actual deno-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS: deno-version output is '$ACTUAL'"
      - name: Assert release-channel is stable
        env:
          ACTUAL: ${{ steps.setup.outputs.release-channel }}
        run: |
          echo "actual release-channel: $ACTUAL"
          if [ "$ACTUAL" != "stable" ]; then
            echo "FAIL: expected release-channel 'stable', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
