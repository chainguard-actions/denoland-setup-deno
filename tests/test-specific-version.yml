name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          deno-version: "1.45.5"
        continue-on-error: true
      - name: Assert action outcome and version output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
          RELEASE_CHANNEL: ${{ steps.action.outputs.release-channel }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deno-version: $DENO_VERSION"
          echo "release-channel: $RELEASE_CHANNEL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DENO_VERSION" != "1.45.5" ]; then
              echo "FAIL: expected '1.45.5', got '$DENO_VERSION'"
              exit 1
            fi
            if [ "$RELEASE_CHANNEL" != "stable" ]; then
              echo "FAIL: expected release-channel 'stable', got '$RELEASE_CHANNEL'"
              exit 1
            fi
            echo "PASS: deno-version='$DENO_VERSION' release-channel='$RELEASE_CHANNEL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert deno binary reports correct version (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if command -v deno >/dev/null 2>&1; then
              ACTUAL=$(deno --version | head -1 | awk '{print $2}')
              echo "deno binary version: $ACTUAL"
              if [ "$ACTUAL" != "1.45.5" ]; then
                echo "FAIL: expected deno binary version '1.45.5', got '$ACTUAL'"
                exit 1
              fi
              echo "PASS: deno binary version matches"
            else
              echo "INFO: deno not found on PATH (PATH propagation may differ under act) - treating as soft pass"
            fi
          else
            echo "SKIP: action did not succeed, skipping binary version check"
          fi
