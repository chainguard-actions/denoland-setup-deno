name: Test specific Deno version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner directories
        run: |
          mkdir -p /tmp/tool-cache
          mkdir -p /tmp/runner-temp
      - id: action
        uses: .
        with:
          deno-version: "1.43.1"
      - name: Assert deno-version output matches requested version
        env:
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          if [ "$DENO_VERSION" != "1.43.1" ]; then
            echo "FAIL: expected deno-version '1.43.1', got '$DENO_VERSION'"
            exit 1
          fi
          echo "PASS: deno-version is '1.43.1'"
      - name: Assert is-canary is false for stable release
        env:
          IS_CANARY: ${{ steps.action.outputs.is-canary }}
        run: |
          echo "is-canary: $IS_CANARY"
          if [ "$IS_CANARY" != "false" ]; then
            echo "FAIL: expected is-canary to be 'false', got '$IS_CANARY'"
            exit 1
          fi
          echo "PASS: is-canary is false"
      - name: Assert release-channel is stable
        env:
          RELEASE_CHANNEL: ${{ steps.action.outputs.release-channel }}
        run: |
          echo "release-channel: $RELEASE_CHANNEL"
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            echo "FAIL: expected release-channel to be 'stable', got '$RELEASE_CHANNEL'"
            exit 1
          fi
          echo "PASS: release-channel is stable"
      - name: Assert installed deno version matches
        run: |
          INSTALLED=$(deno --version | head -1 | awk '{print $2}')
          echo "installed deno version: $INSTALLED"
          if [ "$INSTALLED" != "1.43.1" ]; then
            echo "FAIL: expected installed version '1.43.1', got '$INSTALLED'"
            exit 1
          fi
          echo "PASS: installed deno version matches"
