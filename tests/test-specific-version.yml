name: Test specific pinned deno version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache directories
        run: |
          mkdir -p /tmp/runner-tool-cache
          mkdir -p /tmp/runner-temp
      - id: action
        uses: .
        with:
          deno-version: "2.1.0"
      - name: Assert deno-version output matches requested version
        env:
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ "$DENO_VERSION" != "2.1.0" ]; then
            echo "FAIL: expected deno-version '2.1.0' but got '$DENO_VERSION'"
            exit 1
          fi
          echo "PASS: deno-version=$DENO_VERSION"
      - name: Assert release-channel is stable
        env:
          RELEASE_CHANNEL: ${{ steps.action.outputs.release-channel }}
        run: |
          echo "release-channel: $RELEASE_CHANNEL"
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            echo "FAIL: expected release-channel 'stable' but got '$RELEASE_CHANNEL'"
            exit 1
          fi
          echo "PASS: release-channel=$RELEASE_CHANNEL"
      - name: Assert deno binary reports correct version
        run: |
          echo "PATH: $PATH"
          ACTUAL="$(deno --version | grep '^deno ' | awk '{print $2}')"
          echo "actual deno version from binary: $ACTUAL"
          if [ "$ACTUAL" != "2.1.0" ]; then
            echo "FAIL: expected binary version '2.1.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
