name: Test Deno setup with custom binary name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          deno-version: "2.x"
          deno-binary-name: "deno2"
          cache: "false"
      - name: Assert deno2 binary is available
        run: |
          which deno2
          deno2 --version
          echo "PASS"
      - name: Assert deno-version output is set
        env:
          DENO_VERSION: ${{ steps.setup.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS"
