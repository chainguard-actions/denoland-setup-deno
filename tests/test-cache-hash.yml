name: Test cache-hash input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          deno-version: "2.x"
          cache: "true"
          cache-hash: "abc123customhash"
      - name: Assert deno-version output is set
        env:
          DENO_VERSION: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS: deno-version is '$DENO_VERSION'"
      - name: Assert deno binary is available
        run: |
          if ! command -v deno >/dev/null 2>&1; then
            echo "FAIL: deno binary not found in PATH"
            exit 1
          fi
          echo "PASS: deno is available at $(command -v deno)"
          deno --version
      - name: Assert release-channel output is set
        env:
          RELEASE_CHANNEL: ${{ steps.action.outputs.release-channel }}
        run: |
          echo "release-channel: $RELEASE_CHANNEL"
          if [ -z "$RELEASE_CHANNEL" ]; then
            echo "FAIL: release-channel output is empty"
            exit 1
          fi
          echo "PASS: release-channel is '$RELEASE_CHANNEL'"
