name: Test cache-hash input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          deno-version: "2.x"
          cache: "true"
          cache-hash: "abc123testcachehash"
      - name: Assert deno-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.deno-version }}
        run: |
          echo "actual deno-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected deno-version output to be non-empty"
            exit 1
          fi
          echo "PASS: deno-version=$ACTUAL"
      - name: Assert deno binary is available
        run: |
          which deno
          deno --version
          echo "PASS: deno binary is available"
