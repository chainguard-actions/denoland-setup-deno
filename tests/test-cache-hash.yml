name: Test Deno setup with cache-hash
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          deno-version: "2.x"
          cache: "true"
          cache-hash: "abc123testcachehash"
      - name: Assert deno-version output is set
        env:
          DENO_VERSION: ${{ steps.setup.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-hit output is set (true or false)
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value: $CACHE_HIT"
            exit 1
          fi
          echo "PASS"
      - name: Assert deno binary is available
        run: |
          which deno
          deno --version
          echo "PASS"
