name: Test Deno setup with version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          deno-version-file: "actions/hardened/denoland--setup-deno/v2.0.3/tests/fixtures/.dvmrc"
          cache: "false"
      - name: Assert deno-version output is set
        env:
          DENO_VERSION: ${{ steps.setup.outputs.deno-version }}
        run: |
          echo "deno-version: $DENO_VERSION"
          if [ -z "$DENO_VERSION" ]; then
            echo "FAIL: deno-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert deno binary is available
        run: |
          which deno
          deno --version
          echo "PASS"
